services:
  probely-agent:
    image: probely/farcaster-onprem-agent:v3
    container_name: probely-agent
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      FARCASTER_AGENT_TOKEN: ${FARCASTER_AGENT_TOKEN}
      FARCASTER_API_URL: https://api.us.probely.com
